name: Feedback tesi
description: Feedback del relatore sulla struttura o sul contenuto di uno o più capitoli della tesi.
title: "[Tesi] "
labels: ["thesis-feedback"]
assignees:
  - Verryx-02
body:
  - type: markdown
    attributes:
      value: |
        Può usare questo modulo per lasciare un feedback su struttura o contenuto della tesi. Per una correzione puntuale che hai già scritto lei, può usare invece una Pull Request.

  - type: checkboxes
    id: capitoli
    attributes:
      label: Capitolo/i interessati
      description: A quali capitoli si riferisce il feedback?
      options:
        - label: "1 - Introduzione"
        - label: "2 - Stato dell'arte e contesto tecnologico"
        - label: "3 - Requisiti: metodologia e casi d'uso"
        - label: "4 - Architettura generale e trust zones"
        - label: "5 - Autenticazione e gestione delle identità"
        - label: "6 - Storage e backup dei file"
        - label: "7 - Rete e coordinamento della mesh"
        - label: "8 - Osservabilità e metriche"
        - label: "9 - Testing e validazione"
        - label: "10 - Deployment"
        - label: "11 - Analisi delle proprietà di sicurezza"
        - label: "12 - Conclusioni"
        - label: Appendice
        - label: Struttura generale della tesi
    validations:
      required: true

  - type: checkboxes
    id: tipo
    attributes:
      label: Tipo di feedback
      options:
        - label: Struttura (ordine dei capitoli, cosa includere/togliere, organizzazione)
        - label: Contenuto o correttezza tecnica
        - label: Chiarezza espositiva
        - label: Formattazione o layout
        - label: Altro
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Note
      description: Descrivi il feedback nel dettaglio.
      placeholder: "e.g. Il capitolo 4 anticipa troppi dettagli implementativi che poi si ripetono nei capitoli 5-8..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Grazie per il tempo che dedica a questo feedback.
