# Grafana datasource provisioning (MT-F-04): points Grafana at the same
# TimescaleDB/Postgres database Metrics-Collector writes to - now
# co-located inside Metrics-Collector's own container
# (deployments/compose/metrics-collector.yml, docs/Known_Issues.md's
# KI-18), not a separate metrics-collector-timescaledb container/Compose
# project - entirely via this file - no manual UI datasource
# configuration, per Grafana's own provisioning convention
# (/etc/grafana/provisioning/{datasources,dashboards}). In this dev
# Compose stack Grafana reaches it via the "metrics-collector" ramusb-net
# hostname below; in production (deployments/proxmox/grafana.md) this
# same connection crosses the Tailscale mesh instead, to
# Metrics-Collector's own mesh identity.
apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: metrics-collector:5432
    database: metrics_collector
    user: metrics_collector
    isDefault: true
    editable: false
    secureJsonData:
      password: metrics_collector_dev_only
    jsonData:
      sslmode: disable
      postgresVersion: 1800
      timescaledb: true
