# nginx reverse proxy in front of the co-located Headscale process
# (loopback-only, 127.0.0.1:8081) - see this directory's Dockerfile for
# the full architectural reasoning (NM-F-12, NM-F-14, PKI-F-02).
#
# ONE listener, TWO enforcement regimes on the SAME port (Headscale itself
# does not separate its coordination protocol from its REST admin API by
# port - confirmed by reading github.com/juanfont/headscale@v0.29.2's
# hscontrol/app.go this session: both are served on h.cfg.Addr):
#   - `/api/v1/*` (NM-F-12): requires a valid mTLS client certificate,
#     verified against RAM-USB's internal Certificate-Authority root,
#     AND whose Subject contains organization=NetworkManager
#     (PKI-F-02) - enforced at the LOCATION level (see below for why),
#     not the listener level.
#   - everything else (NM-F-14: Headscale's own coordination protocol -
#     /key, /machine/*, /ts2021, /register/{id}, ...): open to anyone,
#     no client certificate ever requested or required.
#
# # Why "optional at listen level, enforced at location level"
#
# TLS client-certificate verification happens during the TLS handshake
# itself, BEFORE nginx has parsed any HTTP request line/path - so
# `ssl_verify_client` cannot vary per `location` the way ordinary HTTP
# request handling can; it is fundamentally a listener/server-block-level
# setting. Making it unconditionally `on`/`optional_no_ca` would force
# EVERY connection on this port - including every ordinary Tailscale
# client's coordination-protocol traffic - through a client-certificate
# handshake, breaking NM-F-14's "open to anyone" requirement outright.
#
# The fix (a well-established nginx pattern for exactly this "mTLS
# required for one path, not the whole listener" shape, confirmed live
# against a real container this session, not merely written from memory):
# `ssl_verify_client optional` at the server level lets the TLS handshake
# always complete, whether or not the connecting client offers a
# certificate at all (a plain Tailscale client offers none; nginx's own
# CertificateRequest during the handshake is answered with an empty
# Certificate message, which "optional" accepts without error). Nginx
# still fully validates any certificate that IS offered (chain to
# ssl_client_certificate's root, not expired) and exposes the outcome via
# the $ssl_client_verify/$ssl_client_s_dn variables - the `/api/v1/`
# location below then enforces both checks itself, at the HTTP-request
# level, returning 403 before ever forwarding to Headscale if either
# fails. Every other location never inspects these variables at all.
#
# $ssl_client_s_dn's exact format (RFC 2253-ish, comma-separated,
# confirmed live this session against a real certificate issued by this
# project's own Certificate-Authority template
# (third-party/certificate-authority/config/organization.x509.tpl, which
# sets Subject.Organization=Subject.CommonName): "CN=NetworkManager,
# O=NetworkManager" - the regex below matches the O= component
# specifically (PKI-F-02: verify the organization field, not merely that
# *some* valid certificate was presented), anchored so
# "O=NetworkManagerEvil" cannot satisfy it.

user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Websocket upgrade support (Tailscale's browser/WASM client uses a
    # WebSocket GET upgrade for the same ts2021 Noise channel a native
    # client POSTs to - see hscontrol/app.go's own comment on
    # NoiseUpgradeHandler) - the standard nginx idiom for conditionally
    # forwarding the Upgrade header only when the client actually sent
    # one.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # No HTTP/2 - Tailscale's own coordination protocol (ts2021, the
        # native client's own HTTP POST upgrade in particular) does not
        # need it, and Debian bookworm's packaged nginx (1.22.1) predates
        # the standalone "http2 on;" directive (nginx 1.25.1+) - keeping
        # this simple and version-portable rather than reaching for the
        # older "listen ... ssl http2;" combined-directive syntax for a
        # feature this listener has no real need for.
        listen 8080 ssl;

        ssl_protocols TLSv1.3;
        ssl_certificate     /etc/headscale-public-tls/cert.pem;
        ssl_certificate_key /etc/headscale-public-tls/key.pem;

        # RAM-USB's internal Certificate-Authority root - trusted ONLY to
        # verify a client certificate offered for /api/v1/ below, NEVER
        # used for this listener's OWN server identity (ssl_certificate
        # above is a separate, ordinary public-style certificate - see
        # this directory's Dockerfile doc comment for why those are
        # deliberately different trust roots).
        ssl_client_certificate /etc/ram-usb-ca/root_ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        client_max_body_size 1m;
        # Generous: Tailscale's own coordination connections (ts2021,
        # DERP-adjacent long-poll-ish traffic) are long-lived, not a quick
        # request/response - a short proxy timeout would sever legitimate
        # mesh clients mid-session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location /api/v1/ {
            # NM-F-12, PKI-F-02: both checks fail closed (RD-04) - a
            # missing/invalid certificate OR the wrong organization is
            # rejected BEFORE this request ever reaches Headscale.
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }
            if ($ssl_client_s_dn !~ ",?O=NetworkManager(,|$)") {
                return 403;
            }

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            # Headscale's own httpAuthenticationMiddleware still requires
            # its own bearer API key regardless of this proxy's mTLS check
            # (see services/network-manager/internal/headscale/client.go's
            # package doc comment) - forwarded through unmodified, this
            # proxy never inspects or injects it itself.
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            # NM-F-14: no certificate check of any kind - open to anyone,
            # exactly like Headscale's own direct listener would be.
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
    }
}
