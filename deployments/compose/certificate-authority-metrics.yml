# Certificate-Authority's CA-F-03 metrics sidecar - a separate compose
# project from deployments/compose/certificate-authority.yml (this
# project's own one-Compose-file-per-container convention), NOT bundled
# into that file: this service needs its own CA-F-04 bootstrap token,
# minted via `docker exec certificate-authority`, which requires
# certificate-authority already running - bundling both into one file
# would make Compose's own upfront, whole-file environment-variable
# interpolation refuse to start EITHER service until this one's token was
# already set, a deadlock on the very first run. See
# deployments/scripts/certificate-authority-metrics.sh for the exact
# minting sequence (mirrors entry-hub.sh's own pattern).
#
# Requires shells 1 (certificate-authority), 2 (headscale), and 4
# (mqtt-broker) already up - see MANUAL-DISTRIBUTED-RUN.md.
#
# step-ca (the third-party product backing certificate-authority) has no
# native /metrics endpoint - see services/certificate-authority/cmd/
# metrics-sidecar/main.go's own package doc comment for the full design
# (tailing step-ca's own JSON access log, RD-01's constraint on which
# fields this process may ever read, and why it joins the mesh via
# pkg/mesh rather than a real tailscaled).
name: ramusb-certificate-authority-metrics
services:
  certificate-authority-metrics:
    build:
      context: ../..
      dockerfile: deployments/docker/certificate-authority-metrics/Dockerfile
    container_name: certificate-authority-metrics
    environment:
      RAM_USB_CERTIFICATE_AUTHORITY_ACCESS_LOG_PATH: "/var/log/certificate-authority/access.log"
      # CA-F-04's bootstrap subject is "CertificateAuthority", not this
      # process's own container/service name - confirmed live this
      # session: third-party/mosquitto/acl.conf's pre-existing grant
      # ("Certificate-Authority also publishes metrics (CA-F-03)... this
      # ACL grant exists independently of whether/when that publish side
      # is wired") only authorizes the MQTT username "CertificateAuthority"
      # (Mosquitto's use_identity_as_username, mapped from the client
      # certificate's Subject.Organization) to write metrics/Certificate-
      # Authority - minting this token with a differently-named subject
      # (e.g. "CertificateAuthorityMetrics") connects fine but every
      # publish is silently ACL-denied (mosquitto_sub never sees it,
      # PublishOnce's own token.Error() stays nil - see .claude/agent-
      # memory/code-agent.md's "A denied MQTT 3.1.1 PUBLISH/SUBSCRIBE is
      # invisible via Token.Error()" note).
      RAM_USB_CA_BOOTSTRAP_TOKEN: "${RAM_USB_CA_BOOTSTRAP_TOKEN:?mint with: docker exec certificate-authority step ca token CertificateAuthority --ca-url https://certificate-authority:9000 --root /home/step/certs/root_ca.crt --provisioner admin --password-file /run/secrets/ca-password.dev-only}"
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker:8883"
      # Mesh membership (pkg/mesh): reuses tag:certificate-authority
      # (services/network-manager/internal/headscale/policy.go) - that
      # tag's existing ACL rule already grants reachability to the MQTT
      # broker's mesh identity, so no policy.go change was needed for
      # this second tag:certificate-authority-tagged mesh node.
      RAM_USB_CERTIFICATE_AUTHORITY_METRICS_MESH_DIR: "/var/lib/tsnet"
      RAM_USB_CERTIFICATE_AUTHORITY_METRICS_MESH_HOSTNAME: "certificate-authority-metrics"
      RAM_USB_TAILSCALE_CONTROL_URL: "${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://headscale:8080}"
      RAM_USB_CERTIFICATE_AUTHORITY_METRICS_TAILSCALE_AUTHKEY: >-
        ${RAM_USB_CERTIFICATE_AUTHORITY_METRICS_TAILSCALE_AUTHKEY:?mint with:
        docker exec headscale headscale users create certificate-authority-metrics
        && docker exec headscale headscale users list --name certificate-authority-metrics -o json
        && docker exec headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:certificate-authority}
      # Dev-only (pkg/mesh.Config.ControlCAFile) - see
      # deployments/compose/entry-hub.yml's identical env var for why this
      # is only set for Headscale's own self-signed dev certificate.
      RAM_USB_TAILSCALE_CONTROL_CA_FILE: "/etc/mesh-control-ca/cert.dev-only.pem"
    volumes:
      # external: true (see this file's own volumes: section below) -
      # written by certificate-authority.yml's own certificate-authority
      # service, read-only here (RD-01: this is the one process that ever
      # reads it, and it only ever extracts status/duration-ns from each
      # line - see services/certificate-authority/internal/accesslog's own
      # doc comment).
      - ramusb-certificate-authority-logs:/var/log/certificate-authority:ro
      - ramusb-certificate-authority-metrics-mesh-state:/var/lib/tsnet
      - ../../third-party/headscale/dev-tls/cert.dev-only.pem:/etc/mesh-control-ca/cert.dev-only.pem:ro
    networks:
      - ramusb-net

networks:
  ramusb-net:
    external: true

volumes:
  # Owned by (created by) deployments/compose/certificate-authority.yml's
  # own project (ramusb-certificate-authority) - referenced here by its
  # fully-qualified Compose-generated name, not re-declared.
  ramusb-certificate-authority-logs:
    external: true
    name: ramusb-certificate-authority_ramusb-certificate-authority-logs
  ramusb-certificate-authority-metrics-mesh-state:
