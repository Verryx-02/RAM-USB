# Network-Manager. Requires its own CA token, its own mesh pre-auth key,
# and Headscale's own bearer API key (all three minted on the separately-
# deployed Headscale/reverse-proxy container - deployments/compose/
# headscale.yml - by an operator, out-of-band, via
# deployments/scripts/network-manager.sh).
#
# This session's architectural change: Headscale is no longer co-located
# here (see deployments/docker/network-manager/Dockerfile's own package
# doc comment for why - Headscale's own documented limitation is that it
# can never safely join the mesh it coordinates). Network-Manager is now a
# REGULAR mesh-joined service, structurally identical to Security-Switch's
# own deployments/compose/security-switch.yml, plus one deliberate
# exception: its own outbound call to Headscale's admin API
# (RAM_USB_NETWORK_MANAGER_HEADSCALE_API_URL/_API_KEY/_API_CA_FILE below)
# crosses the PUBLIC network, not the mesh - see
# services/network-manager/cmd/network-manager/main.go's own package doc
# comment for the full reasoning.
name: ramusb-network-manager
services:
  network-manager:
    build:
      context: ../..
      dockerfile: deployments/docker/network-manager/Dockerfile
    container_name: network-manager
    cap_add:
      # NET_ADMIN/NET_RAW: the real tailscaled client's own minimum
      # requirement to create/manage the mesh TUN interface (see the
      # Dockerfile's package doc comment) - not needed by
      # network-manager itself.
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # NM-F-03: the port half only - the IP half is this node's real
      # Tailscale mesh address, known only at runtime once tailscale-up
      # joins (see rootfs/etc/s6-overlay/s6-rc.d/network-manager/run),
      # never 0.0.0.0/ramusb-net (NET-F-01). The listener Security-Switch
      # calls (SS-F-05, SS-F-09) is reachable only from inside the
      # Headscale mesh.
      RAM_USB_NETWORK_MANAGER_LISTEN_PORT: "8447"
      # NM-F-08/NM-F-09/NM-F-01..07: Headscale's admin REST API, reached
      # over the PUBLIC network through the separately-deployed reverse
      # proxy (deployments/compose/headscale.yml) - NOT the mesh, see this
      # file's own top-level comment for why. "headscale" here is that
      # container's ramusb-net Docker DNS name in this dev/test stack; in
      # production this would be Headscale's own dedicated VPS's real
      # public hostname.
      RAM_USB_NETWORK_MANAGER_HEADSCALE_API_URL: "https://headscale:8080"
      RAM_USB_NETWORK_MANAGER_HEADSCALE_API_KEY: "${RAM_USB_NETWORK_MANAGER_HEADSCALE_API_KEY:?mint with: docker exec headscale headscale apikeys create --expiration 24h}"
      # Dev-only: trusts the reverse proxy's own self-signed public-facing
      # certificate (third-party/headscale/dev-tls - NEVER RAM-USB's
      # internal Certificate-Authority, see cmd/network-manager/main.go's
      # own package doc comment for why those are different trust roots).
      # Leave unset once that certificate chains to a real, publicly
      # trusted root (a real Let's Encrypt certificate in production).
      RAM_USB_NETWORK_MANAGER_HEADSCALE_API_CA_FILE: "/etc/headscale-api-ca/cert.dev-only.pem"
      RAM_USB_NETWORK_MANAGER_GRANTS_DB_PATH: "/tmp/grants.db"
      RAM_USB_CA_BOOTSTRAP_TOKEN: "${RAM_USB_CA_BOOTSTRAP_TOKEN:?mint with: docker exec certificate-authority step ca token NetworkManager --ca-url https://certificate-authority:9000 --root /home/step/certs/root_ca.crt --provisioner admin --password-file /run/secrets/ca-password.dev-only}"
      # NM-F-17/NM-F-18: metrics publish, reuses the same mTLS identity
      # bootstrapped via RAM_USB_CA_BOOTSTRAP_TOKEN above - no separate
      # static MQTT certificate/key.
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker:8883"
      # Real tailscaled mesh membership (rootfs/etc/s6-overlay/s6-rc.d/
      # tailscaled, tailscale-up): this node's MagicDNS short name, the
      # shared Headscale coordination URL, and a single-use pre-auth key -
      # see services/network-manager/internal/headscale/policy.go for the
      # tag:network-manager ACL rule this key's --tags must match. Same
      # shape as every other mesh-joined service's own compose file now
      # (Security-Switch, Database-Vault, Storage-Service) - Network-
      # Manager is no longer special-cased here.
      RAM_USB_NETWORK_MANAGER_MESH_HOSTNAME: "network-manager"
      RAM_USB_TAILSCALE_CONTROL_URL: "${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://headscale:8080}"
      RAM_USB_NETWORK_MANAGER_TAILSCALE_AUTHKEY: >-
        ${RAM_USB_NETWORK_MANAGER_TAILSCALE_AUTHKEY:?mint with:
        docker exec headscale headscale users create network-manager
        && docker exec headscale headscale users list --name network-manager -o json
        && docker exec headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:network-manager}
    volumes:
      - ramusb-network-manager-tailscale-state:/var/lib/tailscale
      # Dev-only: the reverse proxy's own self-signed certificate, trusted
      # a second time at this fixed path via the real OS trust store
      # (update-ca-certificates, see rootfs/etc/s6-overlay/s6-rc.d/
      # trust-mesh-ca/) for tailscaled's own control-plane dial to
      # RAM_USB_TAILSCALE_CONTROL_URL - identical mechanism to every other
      # mesh-joined service's own compose file.
      - ../../third-party/headscale/dev-tls/cert.dev-only.pem:/usr/local/share/ca-certificates/headscale-dev.crt:ro
      # Same cert file, mounted a second time at the path
      # RAM_USB_NETWORK_MANAGER_HEADSCALE_API_CA_FILE names above - a
      # deliberately separate trust decision from the OS-trust-store mount
      # right above, even though it happens to be the same file in this
      # dev/test stack (see that env var's own doc comment for why).
      - ../../third-party/headscale/dev-tls/cert.dev-only.pem:/etc/headscale-api-ca/cert.dev-only.pem:ro
    # No "ports:" block - network-manager no longer publishes anything to
    # the Docker host at all: Headscale's own public coordination endpoint
    # now lives entirely in the separate deployments/compose/headscale.yml
    # deployment. NM-F-03's mTLS listener binds only to this node's real
    # Tailscale mesh interface address, never ramusb-net either.
    networks:
      - ramusb-net

networks:
  ramusb-net:
    external: true

volumes:
  ramusb-network-manager-tailscale-state:
