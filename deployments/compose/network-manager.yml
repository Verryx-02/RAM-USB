# Network-Manager. Requires ONLY its own 2 variables (Headscale API key +
# CA token) - no other shell/service sees them.
name: ramusb-network-manager
services:
  network-manager:
    build:
      context: ../..
      dockerfile: deployments/docker/network-manager/Dockerfile
    container_name: network-manager
    environment:
      # NM-F-03: this is now a bare tsnet listen address (":port"), not a
      # ramusb-net host:port bind - the listener Security-Switch calls
      # (SS-F-05, SS-F-09) is reachable only from inside the Headscale
      # mesh, never via ramusb-net.
      RAM_USB_NETWORK_MANAGER_LISTEN_ADDR: ":8447"
      RAM_USB_HEADSCALE_ADDR: "network-manager-headscale:50443"
      RAM_USB_HEADSCALE_API_KEY: "${RAM_USB_HEADSCALE_API_KEY:?mint with: docker exec network-manager-headscale /ko-app/headscale apikeys create --expiration 24h}"
      RAM_USB_HEADSCALE_INSECURE_SKIP_VERIFY: "true"
      RAM_USB_NETWORK_MANAGER_GRANTS_DB_PATH: "/tmp/grants.db"
      RAM_USB_CA_BOOTSTRAP_TOKEN: "${RAM_USB_CA_BOOTSTRAP_TOKEN:?mint with: docker exec certificate-authority step ca token NetworkManager --ca-url https://certificate-authority:9000 --root /home/step/certs/root_ca.crt --provisioner admin --password-file /run/secrets/ca-password.dev-only}"
      # NM-F-17/NM-F-18: metrics publish, reuses the same mTLS identity
      # bootstrapped via RAM_USB_CA_BOOTSTRAP_TOKEN above - no separate
      # static MQTT certificate/key.
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker:8883"
      # NM-F-03 mesh membership (pkg/mesh): this node's persistent tsnet
      # identity directory, MagicDNS short name, shared Headscale
      # coordination URL, and single-use pre-auth key. The pre-auth key is
      # minted manually by the operator, the same "docker exec into the
      # coordination server" pattern RAM_USB_CA_BOOTSTRAP_TOKEN above
      # already uses for the Certificate-Authority - see
      # services/network-manager/internal/headscale/policy.go for the
      # tag:network-manager ACL rule this key's --tags must match.
      RAM_USB_NETWORK_MANAGER_MESH_DIR: "/var/lib/tsnet"
      RAM_USB_NETWORK_MANAGER_MESH_HOSTNAME: "network-manager"
      RAM_USB_TAILSCALE_CONTROL_URL: "${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://network-manager-headscale:8080}"
      RAM_USB_NETWORK_MANAGER_TAILSCALE_AUTHKEY: >-
        ${RAM_USB_NETWORK_MANAGER_TAILSCALE_AUTHKEY:?mint with:
        docker exec network-manager-headscale headscale users create network-manager
        && docker exec network-manager-headscale headscale users list --name network-manager -o json
        && docker exec network-manager-headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:network-manager}
      # Dev-only (pkg/mesh.Config.ControlCAFile): this image is distroless
      # (no shell, no update-ca-certificates, an immutable trust store), so
      # trusting Headscale's self-signed dev certificate happens entirely
      # in Go at runtime via SSL_CERT_FILE (see pkg/mesh's package doc
      # comment, "Control-plane certificate trust in a distroless
      # container") instead of the OS trust store. Leave unset once
      # RAM_USB_TAILSCALE_CONTROL_URL's certificate chains to a real,
      # publicly trusted root.
      RAM_USB_TAILSCALE_CONTROL_CA_FILE: "/etc/mesh-control-ca/cert.dev-only.pem"
    volumes:
      - ramusb-network-manager-mesh-state:/var/lib/tsnet
      - ../../third-party/network-manager/headscale/dev-tls/cert.dev-only.pem:/etc/mesh-control-ca/cert.dev-only.pem:ro
    networks:
      - ramusb-net

networks:
  ramusb-net:
    external: true

volumes:
  ramusb-network-manager-mesh-state:
