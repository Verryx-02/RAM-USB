# Certificate-Authority + automatic application of the organization
# template (PKI-F-02) + CA-F-03's metrics sidecar. Requires
# RAM_USB_CERTIFICATE_AUTHORITY_TAILSCALE_AUTHKEY (certificate-authority-mesh's
# sidecar), RAM_USB_CERTIFICATE_AUTHORITY_METRICS_TAILSCALE_AUTHKEY, and
# RAM_USB_CA_BOOTSTRAP_TOKEN (certificate-authority-metrics itself).
#
# certificate-authority-init is included here (not a separate file/shell):
# it waits for the CA to be healthy, applies organization.x509.tpl to the
# "admin" provisioner, then exits on its own - a single `docker compose up`
# covers both, unlike the earlier bash procedure which required a separate
# `docker run --rm` command for the init step.
#
# certificate-authority-config-init/certificate-authority-logs-init (CA-F-03):
# two one-shot steps that must complete BEFORE certificate-authority's own
# first start, not after (unlike certificate-authority-init above) - see
# third-party/certificate-authority/enable-json-logger.sh's own doc comment
# for why step-ca's ca.json can only be patched before its first exec, and
# .claude/agent-memory/code-agent.md's "step-ca JSON access logging" entry
# for the live verification behind both steps. certificate-authority's own
# `command:` override (replacing its default CMD, not its ENTRYPOINT - see
# that same memory entry) tees step-ca's stderr, where its own JSON access
# log always writes, into a shared volume certificate-authority-metrics
# reads from - CA-F-03's actual metrics source, since step-ca has no
# native /metrics endpoint.
#
# certificate-authority-mesh (NM-F-04, "all internal components... can
# contact, and be contacted by, the Certificate-Authority over the mesh
# network"): step-ca is a third-party binary, not a Go process, so it
# cannot embed pkg/mesh the way Security-Switch/Database-Vault do. Instead
# this is the sidecar pattern: a real tailscale/tailscale client container
# (same image/cap_add/devices shape as tailscale-test.yml) joins the mesh
# and shares certificate-authority's OWN network namespace via
# `network_mode: "service:certificate-authority"` - Compose does not allow
# the `networks:` key together with `network_mode` on the SAME container
# (confirmed via `docker compose config`, which rejects that combination
# with "conflicting: services... has both network_mode and networks"), so
# exactly one of the two containers can carry `networks: ramusb-net` and
# exactly one carries `network_mode: "service:..."` - never both keys on
# one container, and never both containers on `networks:`. `cap_add`/
# `devices` (NET_ADMIN/NET_RAW/tun) ARE compatible with `network_mode:
# service:X` on the same (sidecar) container - confirmed live in this
# session: the sidecar creates its own tailscale0 interface inside the
# shared namespace it joins, independent of which container declared the
# capabilities. certificate-authority itself is left completely
# unmodified (still `networks: ramusb-net`, per this task's own
# constraint) - it becomes reachable on the sidecar's tailscale IP/
# MagicDNS hostname "certificate-authority" (TS_EXTRA_ARGS --hostname
# below) for free, with zero code or image change, since both containers
# share one network stack once the sidecar is up. Because that MagicDNS
# short hostname is chosen to equal the existing Docker DNS name, every
# RAM_USB_CA_BOOTSTRAP_TOKEN's `--ca-url https://certificate-authority:9000`
# (see e.g. entry-hub.yml/security-switch.yml) keeps working unchanged for
# every service, whether or not that service is itself a mesh member yet.
name: ramusb-certificate-authority
services:
  # CA-F-03, phase 1: pre-seed ca.json with "logger": {"format": "json"}
  # before certificate-authority's own first start - see this file's own
  # top comment. Reuses the SAME image and the SAME DOCKER_STEPCA_INIT_*
  # env vars so entrypoint.sh's own init_if_possible generates ca.json
  # exactly as certificate-authority's own first start otherwise would;
  # `command` (not `entrypoint`) is overridden so entrypoint.sh's final
  # `exec "${@}"` runs enable-json-logger.sh instead of step-ca itself.
  certificate-authority-config-init:
    image: smallstep/step-ca:latest
    command: ["/bin/sh", "/scripts/enable-json-logger.sh"]
    environment:
      DOCKER_STEPCA_INIT_NAME: "RAM-USB Dev CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "localhost,certificate-authority"
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/ca-password.dev-only
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "true"
    volumes:
      - ramusb-ca-data:/home/step
      - ../../third-party/certificate-authority/config/password.dev-only.txt:/run/secrets/ca-password.dev-only:ro
      - ../../third-party/certificate-authority/enable-json-logger.sh:/scripts/enable-json-logger.sh:ro
    restart: "no"
    networks:
      - ramusb-net

  # CA-F-03, phase 2: the shared access-log volume mounts root-owned by
  # default (a brand-new named volume, no prior image content at that
  # path) - chown it to step-ca's own runtime uid/gid (1000:1000,
  # confirmed live) before certificate-authority's own tee'd `command:`
  # tries to write into it. Runs as root (the one deliberate exception -
  # certificate-authority itself never does) purely to perform this one
  # chown; it never runs step-ca itself.
  certificate-authority-logs-init:
    image: smallstep/step-ca:latest
    user: root
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /var/log/certificate-authority && chmod 0755 /var/log/certificate-authority"]
    volumes:
      - ramusb-certificate-authority-logs:/var/log/certificate-authority
    restart: "no"

  certificate-authority:
    image: smallstep/step-ca:latest
    container_name: certificate-authority
    depends_on:
      certificate-authority-config-init:
        condition: service_completed_successfully
      certificate-authority-logs-init:
        condition: service_completed_successfully
    # Overrides step-ca's own default CMD only - entrypoint.sh's own
    # init logic still runs first via the image's unmodified ENTRYPOINT,
    # but finds ca.json already present (certificate-authority-config-init
    # above) and skips its own init_if_possible. `exec` replaces this
    # bash instance with step-ca itself (confirmed live: `docker exec
    # certificate-authority ps aux` shows step-ca as PID 1), so `docker
    # stop` still delivers SIGTERM directly to it - the process
    # substitution's `tee` is a separate, non-PID-1 child that exits on
    # its own once step-ca closes its end of the pipe. See this file's
    # own top comment for why `/bin/bash`, not the image's default
    # `/bin/sh` (busybox ash, no process-substitution support).
    command: >-
      /bin/bash -c 'exec step-ca --password-file /home/step/secrets/password
      /home/step/config/ca.json 2> >(tee -a /var/log/certificate-authority/access.log >&2)'
    environment:
      DOCKER_STEPCA_INIT_NAME: "RAM-USB Dev CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "localhost,certificate-authority"
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/ca-password.dev-only
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "true"
    ports:
      - "9000:9000"
    volumes:
      - ramusb-ca-data:/home/step
      - ramusb-certificate-authority-logs:/var/log/certificate-authority
      - ../../third-party/certificate-authority/config/password.dev-only.txt:/run/secrets/ca-password.dev-only:ro
      - ../../third-party/certificate-authority/config/organization.x509.tpl:/run/secrets/organization.x509.tpl:ro
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ramusb-net

  certificate-authority-init:
    image: smallstep/step-ca:latest
    entrypoint: ["/bin/sh", "/scripts/init-organization-template.sh"]
    depends_on:
      certificate-authority:
        condition: service_healthy
    volumes:
      - ramusb-ca-data:/home/step:ro
      - ../../third-party/certificate-authority/config/password.dev-only.txt:/run/secrets/ca-password.dev-only:ro
      - ../../third-party/certificate-authority/config/organization.x509.tpl:/run/secrets/organization.x509.tpl:ro
      - ../../third-party/certificate-authority/init-organization-template.sh:/scripts/init-organization-template.sh:ro
    restart: "no"
    networks:
      - ramusb-net

  certificate-authority-mesh:
    image: tailscale/tailscale:latest
    container_name: certificate-authority-mesh
    depends_on:
      certificate-authority:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ramusb-certificate-authority-mesh-state:/var/lib/tailscale
      - ../../third-party/headscale/dev-tls/cert.dev-only.pem:/usr/local/share/ca-certificates/headscale-dev.crt:ro
    environment:
      # tag:certificate-authority (services/network-manager/internal/
      # headscale/policy.go) - reused as-is, NM-F-04's rule already grants
      # this tag reachability both ways, no new tag needed for the CA.
      TS_AUTHKEY: "${RAM_USB_CERTIFICATE_AUTHORITY_TAILSCALE_AUTHKEY:?mint with: docker exec headscale headscale users create certificate-authority && docker exec headscale headscale users list --name certificate-authority -o json && docker exec headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:certificate-authority}"
      TS_EXTRA_ARGS: "--login-server=${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://headscale:8080} --hostname=certificate-authority"
      # Confirmed live this session: containerboot's tailscaled defaults to
      # "--tun=userspace-networking" (a gVisor netstack invisible to the OS
      # kernel/other processes in this shared namespace) even with
      # NET_ADMIN/NET_RAW/tun granted above. In that mode a peer's inbound
      # TCP SYN to this node's tailscale IP is rejected entirely inside
      # tailscaled's own userland network stack - it never reaches a real
      # tailscale0 interface, so certificate-authority (sharing this
      # namespace) never sees the packet, and the connecting peer sees an
      # immediate "connection refused" with nothing captured on either
      # side's tailscale0 (confirmed via tcpdump). TS_USERSPACE=false
      # forces the real kernel tun device instead, which is required for
      # NM-F-04's "can be contacted... over the mesh network" direction
      # (the CA must accept inbound connections, not just originate them -
      # unlike a User's outbound-only tailscale-test.yml client, which
      # works fine in userspace-networking mode and needs no such change).
      TS_USERSPACE: "false"
      # network_mode below means this container has no ramusb-net DNS of
      # its own beyond what certificate-authority's namespace already
      # resolves - the Headscale control URL above is reached through
      # that shared namespace's existing ramusb-net attachment.
    entrypoint: ["/bin/sh", "-c", "update-ca-certificates && exec /usr/local/bin/containerboot"]
    # Shares certificate-authority's network namespace instead of joining
    # ramusb-net itself - see this file's own top comment for why
    # `network_mode` and `networks` never appear on the same container.
    network_mode: "service:certificate-authority"

networks:
  ramusb-net:
    external: true

volumes:
  ramusb-ca-data:
  ramusb-certificate-authority-mesh-state:
  # Written by certificate-authority's own tee'd `command:` above, read by
  # certificate-authority-metrics (CA-F-03, a SEPARATE compose project -
  # see deployments/compose/certificate-authority-metrics.yml, which
  # references this exact volume via `external: true`, following this
  # project's one-compose-file-per-container convention rather than
  # bundling a second mesh identity's own RAM_USB_CA_BOOTSTRAP_TOKEN
  # requirement into this file - minting that token needs
  # certificate-authority already running, which this file's own env
  # interpolation would otherwise deadlock on before ever starting it).
  ramusb-certificate-authority-logs:
