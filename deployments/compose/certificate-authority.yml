# Certificate-Authority + automatic application of the organization
# template (PKI-F-02) + CA-F-03's metrics sidecar. Requires
# RAM_USB_CERTIFICATE_AUTHORITY_TAILSCALE_AUTHKEY (certificate-authority-mesh's
# sidecar) only - CA-F-03's metrics sidecar no longer needs its own
# Tailscale pre-auth key or CA-F-04 bootstrap-token env var: since
# docs/Known_Issues.md's KI-28, it is s6-supervised INSIDE this same
# "certificate-authority" container/image
# (deployments/docker/certificate-authority/), not a separate Compose
# project/container - its own bootstrap token is minted locally, once
# step-ca itself is healthy, by that image's own mint-metrics-token
# oneshot (see that Dockerfile/rootfs for the full mechanism), and its own
# MQTT publish rides the same real tailscaled sidecar (certificate-
# authority-mesh, below) step-ca's own inbound mesh reachability already
# depends on.
#
# certificate-authority-init is included here (not a separate file/shell):
# it waits for the CA to be healthy, applies organization.x509.tpl to the
# "admin" provisioner, then exits on its own - a single `docker compose up`
# covers both, unlike the earlier bash procedure which required a separate
# `docker run --rm` command for the init step.
#
# certificate-authority-config-init (CA-F-03): a one-shot step that must
# complete BEFORE certificate-authority's own first start, not after
# (unlike certificate-authority-init above) - see third-party/
# certificate-authority/enable-json-logger.sh's own doc comment for why
# step-ca's ca.json can only be patched before its first exec, and
# .claude/agent-memory/code-agent.md's "step-ca JSON access logging" entry
# for the live verification behind it. certificate-authority's own image
# (deployments/docker/certificate-authority/Dockerfile) tees step-ca's
# stderr, where its own JSON access log always writes, into a plain local
# path its own co-supervised metrics-sidecar process reads from directly -
# CA-F-03's actual metrics source, since step-ca has no native /metrics
# endpoint. Unlike before KI-28, this is no longer a cross-container
# shared Docker volume: both the writer (step-ca) and the reader (the
# metrics sidecar) are processes inside this ONE container now, so the
# access-log directory is created and chowned once, at image-build time
# (see that Dockerfile), with no separate certificate-authority-logs-init
# compose step needed anymore.
#
# certificate-authority-mesh (NM-F-04, "all internal components... can
# contact, and be contacted by, the Certificate-Authority over the mesh
# network"): step-ca is a third-party binary, not a Go process, so it
# cannot embed pkg/mesh the way Security-Switch/Database-Vault do. Instead
# this is the sidecar pattern: a real tailscale/tailscale client container
# (same image/cap_add/devices shape as tailscale-test.yml) joins the mesh
# and shares certificate-authority's OWN network namespace via
# `network_mode: "service:certificate-authority"` - Compose does not allow
# the `networks:` key together with `network_mode` on the SAME container
# (confirmed via `docker compose config`, which rejects that combination
# with "conflicting: services... has both network_mode and networks"), so
# exactly one of the two containers can carry `networks: ramusb-net` and
# exactly one carries `network_mode: "service:..."` - never both keys on
# one container, and never both containers on `networks:`. `cap_add`/
# `devices` (NET_ADMIN/NET_RAW/tun) ARE compatible with `network_mode:
# service:X` on the same (sidecar) container - confirmed live in this
# session: the sidecar creates its own tailscale0 interface inside the
# shared namespace it joins, independent of which container declared the
# capabilities. certificate-authority itself is left completely
# unmodified in this respect (still `networks: ramusb-net`) - it becomes
# reachable on the sidecar's tailscale IP/MagicDNS hostname
# "certificate-authority" (TS_EXTRA_ARGS --hostname below) for free, with
# zero code or image change, since both containers share one network
# stack once the sidecar is up. Because that MagicDNS short hostname is
# chosen to equal the existing Docker DNS name, every other service's own
# RAM_USB_CA_BOOTSTRAP_TOKEN's `--ca-url https://certificate-authority:9000`
# (see e.g. entry-hub.yml/security-switch.yml) keeps working unchanged for
# every service, whether or not that service is itself a mesh member yet.
# The metrics sidecar co-supervised inside THIS container also reaches
# that same shared tailscale0 interface for its own outbound MQTT publish
# once certificate-authority-mesh is up (KI-28) - see this container's own
# mqtt-broker-ready oneshot for how its metrics longrun's own start is
# gated on that (and the broker itself) being reachable.
name: ramusb-certificate-authority
services:
  # CA-F-03, phase 1: pre-seed ca.json with "logger": {"format": "json"}
  # before certificate-authority's own first start - see this file's own
  # top comment. Reuses the SAME image and the SAME DOCKER_STEPCA_INIT_*
  # env vars so entrypoint.sh's own init_if_possible generates ca.json
  # exactly as certificate-authority's own first start otherwise would;
  # `command` (not `entrypoint`) is overridden so entrypoint.sh's final
  # `exec "${@}"` runs enable-json-logger.sh instead of step-ca itself.
  # Uses the plain upstream image, not the certificate-authority image
  # below - this step never runs step-ca or the metrics sidecar, only
  # patches ca.json.
  certificate-authority-config-init:
    image: smallstep/step-ca:latest
    command: ["/bin/sh", "/scripts/enable-json-logger.sh"]
    environment:
      DOCKER_STEPCA_INIT_NAME: "RAM-USB Dev CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "localhost,certificate-authority"
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/ca-password.dev-only
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "true"
    volumes:
      - ramusb-ca-data:/home/step
      - ../../third-party/certificate-authority/config/password.dev-only.txt:/run/secrets/ca-password.dev-only:ro
      - ../../third-party/certificate-authority/enable-json-logger.sh:/scripts/enable-json-logger.sh:ro
    restart: "no"
    networks:
      - ramusb-net

  certificate-authority:
    build:
      context: ../..
      dockerfile: deployments/docker/certificate-authority/Dockerfile
    container_name: certificate-authority
    depends_on:
      certificate-authority-config-init:
        condition: service_completed_successfully
    environment:
      DOCKER_STEPCA_INIT_NAME: "RAM-USB Dev CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "localhost,certificate-authority"
      DOCKER_STEPCA_INIT_PASSWORD_FILE: /run/secrets/ca-password.dev-only
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "true"
      # CA-F-03's metrics sidecar (co-supervised inside this same
      # container, see this file's own top comment) - its own
      # RAM_USB_CA_BOOTSTRAP_TOKEN is minted locally by the image's own
      # mint-metrics-token oneshot, not set here (see that Dockerfile's
      # rootfs for why a Compose-level `${VAR:?}` requirement would
      # deadlock env-var interpolation for a token this container can only
      # mint against itself, once already running).
      RAM_USB_CERTIFICATE_AUTHORITY_ACCESS_LOG_PATH: "/var/log/certificate-authority/access.log"
      # FQDN, not the short Docker-DNS name "mqtt-broker": this container's
      # own resolver (dns: below) is the mesh's MagicDNS stub, which - like
      # every real `tailscaled` client in this project - only answers
      # short-name-like queries reliably as a fully-qualified name under
      # Headscale's own base_domain (confirmed live this session: a plain
      # "mqtt-broker" query against 100.100.100.100 SERVFAILs, the FQDN
      # form resolves correctly to the mesh IP). See this file's own top
      # comment and docs/Known_Issues.md's KI-28 for why this container
      # needs its own resolver pointed at the mesh at all (unlike a
      # service running a real `tailscaled` directly, which rewrites its
      # OWN /etc/resolv.conf automatically - this container's mesh
      # identity lives in a SEPARATE sidecar container, which cannot
      # rewrite a file in a different container's filesystem even though
      # both share one network namespace).
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker.ramusb-mesh.internal:8883"
    # KI-128: no "ports:" stanza - this used to publish "9000:9000" on the
    # Docker host, which put step-ca's API within reach of anything on the
    # host's LAN interface, outside the mesh and outside NM-F-04's trust
    # model (confirmed live: a TCP connect from the Proxmox host itself,
    # which holds no mesh identity, succeeded in 3ms, while every other
    # internal service refused the same connect because those bind
    # mesh-only). Nothing depends on the published port: every bootstrap
    # token mint in deployments/scripts/*.sh runs via `docker exec
    # certificate-authority step ca token ...` (a call inside this
    # container, against its own localhost), every other service's own
    # RAM_USB_CA_BOOTSTRAP_TOKEN reaches "https://certificate-authority:9000"
    # over ramusb-net's internal Docker DNS (unaffected by removing a HOST
    # port publish), and the healthcheck above already targets
    # "https://localhost:9000" from inside the container. This also matches
    # deployments/proxmox/certificate-authority.md's own "No published
    # ports - hard requirement, not a should" section, which already names
    # the dev stack's port publish as "a deliberate, dev-only
    # simplification" this fix removes rather than a production-required
    # behaviour.
    volumes:
      - ramusb-ca-data:/home/step
      - ramusb-certificate-authority-logs:/var/log/certificate-authority
      - ../../third-party/certificate-authority/config/password.dev-only.txt:/run/secrets/ca-password.dev-only:ro
      - ../../third-party/certificate-authority/config/organization.x509.tpl:/run/secrets/organization.x509.tpl:ro
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ramusb-net
    # KI-28: this container's own outbound DNS resolver is the mesh's
    # MagicDNS stub (100.100.100.100), reachable because it shares
    # certificate-authority-mesh's network namespace (network_mode: below,
    # on that sidecar) even though the two are separate containers with
    # separate filesystems - the ONLY hostname this container's own
    # processes ever need to resolve is the metrics sidecar's own MQTT
    # broker address (step-ca itself makes no outbound DNS-dependent
    # call, and the metrics sidecar's own CA-bootstrap is now a plain
    # https://localhost:9000 call, no DNS needed there either). Without
    # this, the metrics sidecar's own MQTT publish would default to
    # Docker's embedded DNS/ramusb-net - which happens to still work in
    # THIS dev stack (KI-05's dual-reachability) but would not exist at
    # all in production, where mqtt-broker is mesh-only reachable -
    # confirmed live this session (see docs/Known_Issues.md's KI-28).
    dns:
      - 100.100.100.100

  certificate-authority-init:
    image: smallstep/step-ca:latest
    entrypoint: ["/bin/sh", "/scripts/init-organization-template.sh"]
    depends_on:
      certificate-authority:
        condition: service_healthy
    volumes:
      - ramusb-ca-data:/home/step:ro
      - ../../third-party/certificate-authority/config/password.dev-only.txt:/run/secrets/ca-password.dev-only:ro
      - ../../third-party/certificate-authority/config/organization.x509.tpl:/run/secrets/organization.x509.tpl:ro
      - ../../third-party/certificate-authority/init-organization-template.sh:/scripts/init-organization-template.sh:ro
    restart: "no"
    networks:
      - ramusb-net

  certificate-authority-mesh:
    image: tailscale/tailscale:latest
    container_name: certificate-authority-mesh
    depends_on:
      certificate-authority:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ramusb-certificate-authority-mesh-state:/var/lib/tailscale
      - ../../third-party/headscale/dev-tls/cert.dev-only.pem:/usr/local/share/ca-certificates/headscale-dev.crt:ro
    environment:
      # tag:certificate-authority (services/network-manager/internal/
      # headscale/policy.go) - reused as-is, NM-F-04's rule already grants
      # this tag reachability both ways, no new tag needed for the CA.
      TS_AUTHKEY: "${RAM_USB_CERTIFICATE_AUTHORITY_TAILSCALE_AUTHKEY:?mint with: docker exec headscale headscale users create certificate-authority && docker exec headscale headscale users list --name certificate-authority -o json && docker exec headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:certificate-authority}"
      TS_EXTRA_ARGS: "--login-server=${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://headscale:8080} --hostname=certificate-authority"
      # Confirmed live this session: containerboot's tailscaled defaults to
      # "--tun=userspace-networking" (a gVisor netstack invisible to the OS
      # kernel/other processes in this shared namespace) even with
      # NET_ADMIN/NET_RAW/tun granted above. In that mode a peer's inbound
      # TCP SYN to this node's tailscale IP is rejected entirely inside
      # tailscaled's own userland network stack - it never reaches a real
      # tailscale0 interface, so certificate-authority (sharing this
      # namespace) never sees the packet, and the connecting peer sees an
      # immediate "connection refused" with nothing captured on either
      # side's tailscale0 (confirmed via tcpdump). TS_USERSPACE=false
      # forces the real kernel tun device instead, which is required for
      # NM-F-04's "can be contacted... over the mesh network" direction
      # (the CA must accept inbound connections, not just originate them -
      # unlike a User's outbound-only tailscale-test.yml client, which
      # works fine in userspace-networking mode and needs no such change).
      TS_USERSPACE: "false"
      # network_mode below means this container has no ramusb-net DNS of
      # its own beyond what certificate-authority's namespace already
      # resolves - the Headscale control URL above is reached through
      # that shared namespace's existing ramusb-net attachment.
    entrypoint: ["/bin/sh", "-c", "update-ca-certificates && exec /usr/local/bin/containerboot"]
    # Shares certificate-authority's network namespace instead of joining
    # ramusb-net itself - see this file's own top comment for why
    # `network_mode` and `networks` never appear on the same container.
    network_mode: "service:certificate-authority"

networks:
  ramusb-net:
    external: true

volumes:
  ramusb-ca-data:
  ramusb-certificate-authority-mesh-state:
  # Written by step-ca's own tee'd command (deployments/docker/
  # certificate-authority/rootfs's own step-ca longrun) and read by the
  # metrics sidecar co-supervised in the SAME container (KI-28) - no
  # longer shared across Compose projects/containers, just kept as a named
  # volume (rather than an ephemeral in-image path) so the access log
  # survives a container recreate, same as before.
  ramusb-certificate-authority-logs:
