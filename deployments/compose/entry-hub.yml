# Entry-Hub. Requires its own CA token, a mesh pre-auth key, and (for local
# dev) the same Headscale dev-only control-plane certificate every other
# mesh-joined service trusts.
#
# Unlike Security-Switch/Database-Vault/Network-Manager/Storage-Service,
# Entry-Hub joins the mesh via pkg/mesh's in-process tsnet (see
# services/entry-hub/cmd/entry-hub/main.go's package doc comment, "Mesh
# membership") - no NET_ADMIN/NET_RAW capability, no /dev/net/tun device,
# no real tailscaled daemon: tsnet runs entirely in userspace inside this
# one Go process.
#
# ramusb-net is still required here (EH-F-01/EH-F-02's public listener
# itself never uses it - see "ports:" below - but pkg/pki's very first
# CA-bootstrap-token exchange has no interceptable dial path, per
# pkg/pki/dialer.go's own doc comment, and always goes out over this
# container's default network path).
name: ramusb-entry-hub
services:
  entry-hub:
    build:
      context: ../..
      dockerfile: deployments/docker/entry-hub/Dockerfile
    container_name: entry-hub
    environment:
      # EH-F-01/EH-F-02: Entry-Hub's public listener.
      RAM_USB_ENTRY_HUB_LISTEN_ADDR: "0.0.0.0:8443"
      RAM_USB_ENTRY_HUB_TLS_CERT: "/certs/server.dev-only.crt"
      RAM_USB_ENTRY_HUB_TLS_KEY: "/certs/server.dev-only.key"
      # EH-F-03: a bare tsnet listen address - reachable only from inside
      # the mesh, never via ramusb-net or the public socket above.
      RAM_USB_ENTRY_HUB_LOGIN_LISTEN_ADDR: ":8446"
      # EH-F-07: Security-Switch's own MagicDNS short mesh hostname
      # (RAM_USB_SECURITY_SWITCH_MESH_HOSTNAME in
      # deployments/compose/security-switch.yml), dialed over the mesh
      # (meshNode.Dial) now that Security-Switch is mesh-only reachable -
      # never ramusb-net, regardless of what this hostname string also
      # happens to resolve to there.
      RAM_USB_SECURITY_SWITCH_URL: "https://security-switch:8444"
      RAM_USB_CA_BOOTSTRAP_TOKEN: "${RAM_USB_CA_BOOTSTRAP_TOKEN:?mint with: docker exec certificate-authority step ca token EntryHub --ca-url https://certificate-authority:9000 --root /home/step/certs/root_ca.crt --provisioner admin --password-file /run/secrets/ca-password.dev-only}"
      # EH-F-10/EH-F-11: metrics publish, reuses the same mTLS identity
      # bootstrapped via RAM_USB_CA_BOOTSTRAP_TOKEN above - no separate
      # static MQTT certificate/key - routed through the mesh
      # (meshNode.Dial) too, now that the MQTT broker's mesh identity is
      # reachable that way.
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker:8883"
      # Mesh membership (pkg/mesh, see this file's own package doc
      # comment): this node's persistent tsnet identity directory,
      # MagicDNS short name, shared Headscale coordination URL, and
      # single-use pre-auth key - see services/network-manager/internal/
      # headscale/policy.go for the tag:entry-hub ACL rules this key's
      # --tags must match.
      RAM_USB_ENTRY_HUB_MESH_DIR: "/var/lib/tsnet"
      RAM_USB_ENTRY_HUB_MESH_HOSTNAME: "entry-hub"
      RAM_USB_TAILSCALE_CONTROL_URL: "${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://headscale:8080}"
      RAM_USB_ENTRY_HUB_TAILSCALE_AUTHKEY: >-
        ${RAM_USB_ENTRY_HUB_TAILSCALE_AUTHKEY:?mint with:
        docker exec headscale headscale users create entry-hub
        && docker exec headscale headscale users list --name entry-hub -o json
        && docker exec headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:entry-hub}
      # Dev-only (pkg/mesh.Config.ControlCAFile): this image is
      # distroless (no shell, no update-ca-certificates, an immutable
      # trust store), so trusting Headscale's self-signed dev
      # certificate happens entirely in Go at runtime via SSL_CERT_FILE
      # (see pkg/mesh's package doc comment, "Control-plane certificate
      # trust in a distroless container") instead of the OS trust store.
      # Leave unset once RAM_USB_TAILSCALE_CONTROL_URL's certificate
      # chains to a real, publicly trusted root.
      RAM_USB_TAILSCALE_CONTROL_CA_FILE: "/etc/mesh-control-ca/cert.dev-only.pem"
    volumes:
      - ../../third-party/entry-hub/config:/certs:ro
      - ramusb-entry-hub-mesh-state:/var/lib/tsnet
      - ../../third-party/headscale/dev-tls/cert.dev-only.pem:/etc/mesh-control-ca/cert.dev-only.pem:ro
    ports:
      - "8443:8443"
    networks:
      - ramusb-net

networks:
  ramusb-net:
    external: true

volumes:
  ramusb-entry-hub-mesh-state:
