# Entry-Hub. Requires its own CA token and a mesh pre-auth key for its
# entry-hub-mesh sidecar (below).
#
# entry-hub-mesh (KI-27, docs/Known_Issues.md): Entry-Hub used to join the
# mesh via pkg/mesh's in-process tsnet, but pkg/pki's very first CA-
# bootstrap-token exchange has no interceptable dial path (pkg/pki/
# dialer.go's own doc comment) and always goes out over this container's
# ordinary default network route - fine in dev (ramusb-net reaches
# Certificate-Authority, KI-05's dual-reachability), but with no address to
# dial at all in production, where Certificate-Authority is mesh-only
# reachable and Entry-Hub's default route is the public internet. The fix
# is the same sidecar pattern already used for step-ca/Mosquitto/Grafana
# (see .claude/agent-memory/code-agent/sidecar-mesh-pattern.md): a real
# tailscale/tailscale container sharing a network namespace with entry-hub
# gives that container a genuine kernel tailscale0 interface, so the OS
# itself routes every outbound call - including the one bootstrap-token
# exchange pkg/pki gives no hook for - through the mesh once
# Certificate-Authority's hostname resolves via MagicDNS (TS_ACCEPT_DNS=true
# below, matching the effective behavior of Database-Vault/Security-Switch/
# Storage-Service's own tailscale-up.sh - NOT containerboot's own default,
# which is false regardless of the plain `tailscale` CLI's true default,
# confirmed live this session - and NOT Network-Manager's --accept-dns=false,
# which is an NM-F-16-specific exception). TS_USERSPACE=false is required:
# EH-F-03's login listener is a Go process (not tailscaled itself) accepting
# inbound mesh traffic through this shared namespace, and userspace-
# networking mode has no kernel-visible tailscale0 interface for a separate
# process to see (see grafana.yml's own top comment for the live-verified
# reasoning this mirrors). See services/entry-hub/cmd/entry-hub/main.go's
# package doc comment, "Mesh membership", for how this process itself
# discovers its own mesh IPv4 address (no shell inside this image to run
# `tailscale ip -4`) and binds EH-F-03's login listener to it explicitly.
#
# KI-122: entry-hub-mesh, not entry-hub, OWNS the shared network namespace
# (`networks: ramusb-net` + the published 8443 port now live on
# entry-hub-mesh; entry-hub joins it via `network_mode:
# "service:entry-hub-mesh"`). Originally this was the other way round, and
# it was wrong: entry-hub exits with "discover mesh ipv4 address: interface
# tailscale0 has no IPv4 address after 30s" whenever the mesh is not yet up,
# and every such exit tore down the very namespace its own sidecar depended
# on, since Compose derives a `network_mode: "service:X"` container's
# namespace from whichever container X currently is. Reproduced live
# 2026-08-23: the sidecar logged "LinkChange: all links down; pausing" and
# "Tailscale cannot connect because the network is down" the instant
# entry-hub restarted, and neither side recovered without manual
# intervention. With the sidecar as the namespace owner, its own tailscaled
# process (and the tailscale0 interface it holds) survives every entry-hub
# restart untouched, matching Compose's real dependency direction: the
# short-lived, restart-prone process should be the one joining a
# longer-lived namespace, not the one hosting it. One consequence of this
# inversion: Compose rejects `extra_hosts`/`--add-host` on a container using
# `network_mode: "service:X"` - not an issue here, since entry-hub declares
# no `extra_hosts` today (RAM_USB_SECURITY_SWITCH_URL/RAM_USB_MQTT_BROKER_URL
# below are plain hostnames resolved via MagicDNS through the shared
# tailscale0 interface, not `/etc/hosts` entries), but any future hostname
# mapping Entry-Hub needs would have to come from the sidecar side (e.g. a
# mounted `/etc/hosts` file) instead.
name: ramusb-entry-hub
services:
  entry-hub:
    build:
      context: ../..
      dockerfile: deployments/docker/entry-hub/Dockerfile
    container_name: entry-hub
    # KI-122: joins entry-hub-mesh's namespace instead of owning one - see
    # this file's own top comment. Compose only needs entry-hub-mesh
    # STARTED (its tailscaled process running), not mesh-joined yet, since
    # entry-hub's own startup already waits out its own 30s mesh-IPv4
    # discovery window.
    depends_on:
      entry-hub-mesh:
        condition: service_started
    network_mode: "service:entry-hub-mesh"
    environment:
      # EH-F-01/EH-F-02: Entry-Hub's public listener.
      RAM_USB_ENTRY_HUB_LISTEN_ADDR: "0.0.0.0:8443"
      RAM_USB_ENTRY_HUB_TLS_CERT: "/certs/server.dev-only.crt"
      RAM_USB_ENTRY_HUB_TLS_KEY: "/certs/server.dev-only.key"
      # EH-F-03: a bare port - main.go's own meshIPv4 supplies the host
      # part at runtime, once entry-hub-mesh's sidecar (below) has actually
      # joined and this container's own tailscale0 interface has an
      # address - reachable only from inside the mesh, never via
      # ramusb-net or the public socket above.
      RAM_USB_ENTRY_HUB_LOGIN_LISTEN_ADDR: ":8446"
      # EH-F-07: Security-Switch's own MagicDNS short mesh hostname
      # (RAM_USB_SECURITY_SWITCH_MESH_HOSTNAME in
      # deployments/compose/security-switch.yml), reachable transparently
      # through this container's own real tailscale0 interface now that
      # Security-Switch is mesh-only reachable - never ramusb-net,
      # regardless of what this hostname string also happens to resolve to
      # there.
      RAM_USB_SECURITY_SWITCH_URL: "https://security-switch:8444"
      # Needed only on this service's very first start (CA-F-04, KI-126) -
      # once the mTLS identity is persisted under the pki-identity volume
      # below, restarts reuse it and never touch this variable again. Mint
      # with: docker exec certificate-authority step ca token EntryHub --ca-url https://certificate-authority:9000 --root /home/step/certs/root_ca.crt --provisioner admin --password-file /run/secrets/ca-password.dev-only
      RAM_USB_CA_BOOTSTRAP_TOKEN: "${RAM_USB_CA_BOOTSTRAP_TOKEN:-}"
      # EH-F-10/EH-F-11: metrics publish, reuses the same mTLS identity
      # bootstrapped via RAM_USB_CA_BOOTSTRAP_TOKEN above - no separate
      # static MQTT certificate/key - reachable transparently through this
      # container's own real tailscale0 interface too, now that the MQTT
      # broker's mesh identity is reachable that way.
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker:8883"
    volumes:
      - ../../third-party/entry-hub/config:/certs:ro
      # CA-F-04: pkg/pki's persisted mTLS identity - see database-vault.yml's
      # identical volume for the full reasoning (KI-126). This image runs
      # as the distroless ":nonroot" account (uid/gid 65532), which is why
      # the Dockerfile pre-creates and chowns this path at build time
      # (see that Dockerfile's own comment) - a fresh named volume mounted
      # here inherits that ownership.
      - ramusb-entry-hub-pki-identity:/var/lib/ram-usb/pki-identity
    # No "ports:"/"networks:" here anymore (KI-122) - entry-hub-mesh below
    # now owns the shared namespace and publishes 8443 on its behalf;
    # Compose does not allow `networks:` together with `network_mode` on
    # the same container (see certificate-authority.yml's own top comment
    # for the confirmed `docker compose config` rejection).

  # See this file's own top comment ("entry-hub-mesh"/KI-122) for the full
  # design. This container now owns the shared network namespace - it
  # starts independently of entry-hub (no depends_on here), so its own
  # tailscaled process and tailscale0 interface survive an entry-hub
  # restart untouched.
  entry-hub-mesh:
    image: tailscale/tailscale:latest
    container_name: entry-hub-mesh
    ports:
      - "8443:8443"
    networks:
      - ramusb-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ramusb-entry-hub-mesh-state:/var/lib/tailscale
      - ../../third-party/headscale/dev-tls/cert.dev-only.pem:/usr/local/share/ca-certificates/headscale-dev.crt:ro
    environment:
      # tag:entry-hub (services/network-manager/internal/headscale/
      # policy.go's TagEntryHub) - already grants reachability toward
      # tag:certificate-authority (NM-F-04) and tag:mqtt-broker; no policy
      # change was needed for this task (both rules already listed
      # TagEntryHub as a Src before this sidecar existed).
      TS_AUTHKEY: "${RAM_USB_ENTRY_HUB_TAILSCALE_AUTHKEY:?mint with: docker exec headscale headscale users create entry-hub && docker exec headscale headscale users list --name entry-hub -o json && docker exec headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:entry-hub}"
      TS_EXTRA_ARGS: "--login-server=${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://headscale:8080} --hostname=entry-hub"
      # Required: EH-F-03's login listener is a separate Go process
      # (entry-hub itself, sharing this namespace) that must ACCEPT
      # inbound mesh connections, and must also see a real kernel
      # tailscale0 interface to bind its own listener to (main.go's
      # meshIPv4) - userspace-networking mode has no kernel-visible
      # interface for either to use. See this file's own top comment.
      TS_USERSPACE: "false"
      # Required (confirmed live this session, KI-27): containerboot's own
      # `tailscale up` invocation passes --accept-dns=false UNLESS this
      # env var is set, regardless of the plain `tailscale` CLI's own
      # true default (which is all Database-Vault/Security-Switch/
      # Storage-Service's own tailscale-up.sh relies on, since none of
      # them go through containerboot) - without it, this container's own
      # `/etc/resolv.conf` stays on Docker's embedded resolver, and every
      # outbound call this process makes by hostname (Certificate-
      # Authority's own CA-bootstrap exchange included) keeps resolving
      # via ramusb-net instead of MagicDNS, exactly the KI-27 gap this
      # sidecar exists to close.
      TS_ACCEPT_DNS: "true"
    entrypoint: ["/bin/sh", "-c", "update-ca-certificates && exec /usr/local/bin/containerboot"]

networks:
  ramusb-net:
    external: true

volumes:
  # entry-hub-mesh's own persistent Tailscale identity/state - same "keep
  # the same mesh node across container restarts" pattern as every other
  # mesh sidecar's own named state volume.
  ramusb-entry-hub-mesh-state:
  ramusb-entry-hub-pki-identity:
