# Database-Vault. Requires its own variables - no other shell/service knows
# or sees them - PLUS RAM_USB_DATABASE_VAULT_POSTGRES_PASSWORD, which must
# instead be exported with the SAME value used to start postgres.yml
# (separate shell, separate Compose project): this shell does not duplicate
# that value as a literal, it only references it via Compose interpolation
# in the connection string below. A different value causes Postgres
# authentication to fail with an error Database-Vault cannot self-diagnose.
name: ramusb-database-vault
services:
  database-vault:
    build:
      context: ../..
      dockerfile: deployments/docker/database-vault/Dockerfile
    container_name: database-vault
    environment:
      # DV-F-01: this is now a bare tsnet listen address (":port"), not a
      # ramusb-net host:port bind - the register/login listener
      # Security-Switch calls (SS-F-04) is reachable only from inside the
      # Headscale mesh, never via ramusb-net. ST-F-11's separate
      # public-key listener below is unaffected, still on ramusb-net.
      RAM_USB_DATABASE_VAULT_LISTEN_ADDR: ":8445"
      RAM_USB_DATABASE_VAULT_PUBLIC_KEY_LISTEN_ADDR: "0.0.0.0:8446"
      RAM_USB_DATABASE_VAULT_DATABASE_URL: "postgres://database_vault:${RAM_USB_DATABASE_VAULT_POSTGRES_PASSWORD:?set the SAME password exported for postgres.yml}@database-vault-postgres:5432/database_vault?sslmode=disable"
      RAM_USB_STORAGE_SERVICE_URL: "https://storage-service:8448"
      RAM_USB_MASTER_KEY: "${RAM_USB_MASTER_KEY:?generate with: openssl rand -base64 32}"
      RAM_USB_PASSWORD_PEPPER: "${RAM_USB_PASSWORD_PEPPER:?set any dev-only string}"
      RAM_USB_CA_BOOTSTRAP_TOKEN: "${RAM_USB_CA_BOOTSTRAP_TOKEN:?mint with: docker exec certificate-authority step ca token DatabaseVault --ca-url https://certificate-authority:9000 --root /home/step/certs/root_ca.crt --provisioner admin --password-file /run/secrets/ca-password.dev-only}"
      # DV-F-16/DV-F-17: metrics publish, reuses the same mTLS identity
      # bootstrapped via RAM_USB_CA_BOOTSTRAP_TOKEN above - no separate
      # static MQTT certificate/key.
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker:8883"
      # DV-F-01 mesh membership (pkg/mesh): this node's persistent tsnet
      # identity directory, MagicDNS short name, shared Headscale
      # coordination URL, and single-use pre-auth key. The pre-auth key
      # is minted manually by the operator, the same "docker exec into
      # the coordination server" pattern RAM_USB_CA_BOOTSTRAP_TOKEN above
      # already uses for the Certificate-Authority - see
      # services/network-manager/internal/headscale/policy.go for the
      # tag:database-vault ACL rule this key's --tags must match.
      RAM_USB_DATABASE_VAULT_MESH_DIR: "/var/lib/tsnet"
      RAM_USB_DATABASE_VAULT_MESH_HOSTNAME: "database-vault"
      RAM_USB_TAILSCALE_CONTROL_URL: "${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://network-manager-headscale:8080}"
      RAM_USB_DATABASE_VAULT_TAILSCALE_AUTHKEY: >-
        ${RAM_USB_DATABASE_VAULT_TAILSCALE_AUTHKEY:?mint with:
        docker exec network-manager-headscale headscale users create database-vault
        && docker exec network-manager-headscale headscale users list --name database-vault -o json
        && docker exec network-manager-headscale headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:database-vault}
      # Dev-only (pkg/mesh.Config.ControlCAFile): this image is
      # distroless (no shell, no update-ca-certificates, an immutable
      # trust store), so trusting Headscale's self-signed dev
      # certificate happens entirely in Go at runtime via SSL_CERT_FILE
      # (see pkg/mesh's package doc comment, "Control-plane certificate
      # trust in a distroless container") instead of the OS trust store.
      # Leave unset once RAM_USB_TAILSCALE_CONTROL_URL's certificate
      # chains to a real, publicly trusted root.
      RAM_USB_TAILSCALE_CONTROL_CA_FILE: "/etc/mesh-control-ca/cert.dev-only.pem"
    volumes:
      - ramusb-database-vault-mesh-state:/var/lib/tsnet
      - ../../third-party/network-manager/headscale/dev-tls/cert.dev-only.pem:/etc/mesh-control-ca/cert.dev-only.pem:ro
    networks:
      - ramusb-net

networks:
  ramusb-net:
    external: true

volumes:
  ramusb-database-vault-mesh-state:
