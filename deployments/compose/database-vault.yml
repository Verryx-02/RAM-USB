# Database-Vault. This is now a single self-contained service - Postgres is
# merged into this same container (deployments/docker/database-vault/Dockerfile
# builds FROM postgres:17 and layers s6-overlay + the database-vault Go
# binary on top), reachable from nothing but this container's own
# database-vault process (Postgres binds to loopback only). This file is the
# SOLE place RAM_USB_DATABASE_VAULT_POSTGRES_PASSWORD is generated and used -
# no separate postgres.yml Compose project, no cross-shell/cross-project
# requirement to export the identical password value twice (that used to be
# a real, recurring source of Postgres SASL auth failures in this project;
# a single file removes the failure mode entirely).
#
# This container also joins the mesh via a REAL, OS-level tailscaled client
# (see the Dockerfile's own doc comment) instead of pkg/mesh's in-process
# tsnet - required for the Certificate-Authority bootstrap/renewal calls and
# the MQTT metrics publish to actually route through the mesh, which
# pkg/mesh's in-process netstack could not do for those two libraries'
# internal/background traffic. Still requires ramusb-net at container-join
# time: this node reaches Network-Manager's co-located Headscale, and this
# process still needs the CA-token minting/MQTT reachability ramusb-net
# already provided - a later task verifies/removes ramusb-net network-wide
# once every service has made this same conversion.
name: ramusb-database-vault
services:
  database-vault:
    build:
      context: ../..
      dockerfile: deployments/docker/database-vault/Dockerfile
    container_name: database-vault
    # No cap_drop here (unlike Storage-Service's own compose file): this
    # container's default capability set is not otherwise scoped down, and
    # Postgres's own docker-entrypoint.sh privilege-drop (root -> "postgres"
    # via gosu, see the Dockerfile's own comment) is unverified against a
    # minimal explicit set - only the real tailscaled client's own minimum
    # requirement (NET_ADMIN/NET_RAW, to create/manage the mesh TUN
    # interface) is added on top of the default set.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # DV-F-01: this is the port half only - the IP half is this node's
      # Tailscale mesh address, known only at runtime once tailscale-up
      # joins (see rootfs/etc/s6-overlay/s6-rc.d/database-vault/run), never
      # 0.0.0.0/ramusb-net (NET-F-01). RAM_USB_DATABASE_VAULT_LISTEN_ADDR
      # itself is no longer set here - it is assembled inside the
      # container by that longrun's own run script.
      RAM_USB_DATABASE_VAULT_LISTEN_PORT: "8445"
      RAM_USB_DATABASE_VAULT_PUBLIC_KEY_LISTEN_ADDR: "0.0.0.0:8446"
      # Postgres now lives inside this same container, bound to loopback
      # only (deployments/docker/database-vault/rootfs/etc/s6-overlay/
      # s6-rc.d/postgres/run passes -c listen_addresses=localhost to it) -
      # the connection host is "localhost", not a separate container name.
      # POSTGRES_USER/POSTGRES_DB below must match this DSN's user/dbname.
      RAM_USB_DATABASE_VAULT_DATABASE_URL: "postgres://database_vault:${RAM_USB_DATABASE_VAULT_POSTGRES_PASSWORD:?generate with: openssl rand -hex 16}@localhost:5432/database_vault?sslmode=disable"
      # Consumed directly by the postgres longrun's own `run` script, which
      # execs the upstream postgres:17 image's own docker-entrypoint.sh -
      # first-run initdb and the user/password/db bootstrap behave exactly
      # as upstream intends. Same variable as the connection string above,
      # referenced once here and once there via Compose interpolation - no
      # duplicated literal, no second shell/Compose project to keep in sync.
      POSTGRES_USER: database_vault
      POSTGRES_PASSWORD: "${RAM_USB_DATABASE_VAULT_POSTGRES_PASSWORD:?generate with: openssl rand -hex 16}"
      POSTGRES_DB: database_vault
      RAM_USB_STORAGE_SERVICE_URL: "https://storage-service:8448"
      RAM_USB_MASTER_KEY: "${RAM_USB_MASTER_KEY:?generate with: openssl rand -base64 32}"
      RAM_USB_PASSWORD_PEPPER: "${RAM_USB_PASSWORD_PEPPER:?set any dev-only string}"
      RAM_USB_CA_BOOTSTRAP_TOKEN: "${RAM_USB_CA_BOOTSTRAP_TOKEN:?mint with: docker exec certificate-authority step ca token DatabaseVault --ca-url https://certificate-authority:9000 --root /home/step/certs/root_ca.crt --provisioner admin --password-file /run/secrets/ca-password.dev-only}"
      # DV-F-16/DV-F-17: metrics publish, reuses the same mTLS identity
      # bootstrapped via RAM_USB_CA_BOOTSTRAP_TOKEN above - no separate
      # static MQTT certificate/key.
      RAM_USB_MQTT_BROKER_URL: "tls://mqtt-broker:8883"
      # Real tailscaled mesh membership (rootfs/etc/s6-overlay/s6-rc.d/
      # {tailscaled,tailscale-up,trust-mesh-ca}): this node's MagicDNS short
      # name, the shared Headscale coordination URL, and a single-use
      # pre-auth key - see services/network-manager/internal/headscale/
      # policy.go for the tag:database-vault ACL rule this key's --tags
      # must match. Unlike before this task's conversion (pkg/mesh's
      # persistent tsnet state directory), this is a real OS-level
      # tailscaled, so its equivalent persistent state lives in the
      # ramusb-database-vault-mesh-state volume below, not a Go-managed
      # directory.
      RAM_USB_DATABASE_VAULT_MESH_HOSTNAME: "database-vault"
      RAM_USB_TAILSCALE_CONTROL_URL: "${RAM_USB_TAILSCALE_CONTROL_URL:?set to the Headscale coordination URL, e.g. https://network-manager:8080}"
      RAM_USB_DATABASE_VAULT_TAILSCALE_AUTHKEY: >-
        ${RAM_USB_DATABASE_VAULT_TAILSCALE_AUTHKEY:?mint with:
        docker exec network-manager headscale users create database-vault
        && docker exec network-manager headscale users list --name database-vault -o json
        && docker exec network-manager headscale preauthkeys create --user <ID_FROM_PREVIOUS_COMMAND> --expiration 15m --tags tag:database-vault}
    volumes:
      - ramusb-database-vault-mesh-state:/var/lib/tailscale
      - ramusb-postgres-data:/var/lib/postgresql/data
      # Dev-only: Headscale's self-signed control-plane certificate,
      # trusted via the real OS trust store (update-ca-certificates, see
      # rootfs/etc/s6-overlay/s6-rc.d/tailscale-up/up and trust-mesh-ca/) -
      # this base image has a real shell/package manager, so the standard
      # mechanism applies directly, same as Storage-Service's own compose
      # file. Leave this volume unmounted once RAM_USB_TAILSCALE_CONTROL_URL
      # carries a publicly-trusted-root certificate.
      - ../../third-party/network-manager/headscale/dev-tls/cert.dev-only.pem:/usr/local/share/ca-certificates/headscale-dev.crt:ro
    # No "ports:" for the register/login listener - it binds exclusively to
    # this node's Tailscale interface address, never 0.0.0.0/ramusb-net
    # (NET-F-01). ST-F-11's public-key listener stays on ramusb-net (see
    # RAM_USB_DATABASE_VAULT_PUBLIC_KEY_LISTEN_ADDR above), reachable
    # through this same "networks:" entry.
    networks:
      - ramusb-net

networks:
  ramusb-net:
    external: true

volumes:
  ramusb-database-vault-mesh-state:
  ramusb-postgres-data:
